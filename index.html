<script>
function chooseTool(text) {
  const input = document.getElementById('question');
  input.value = text;
  input.focus();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('askForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const input = document.getElementById('question');
  const result = document.getElementById('result');
  const button = this.querySelector('button[type="submit"]');
  const message = input.value.trim();

  if (!message) {
    result.textContent = '请先输入问题。';
    return;
  }

  result.textContent = '正在思考，请稍候……';
  button.disabled = true;

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ message: message })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || 'AI 服务暂时不可用，请稍后重试。');
    }

    if (!data.reply) {
      throw new Error('AI 暂时没有返回答案。');
    }

    result.textContent = data.reply;

  } catch (error) {
    result.textContent = '连接失败：' + error.message;
  } finally {
    button.disabled = false;
  }
});
</script>
